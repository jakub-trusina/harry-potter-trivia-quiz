<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Territory Conquest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hogwarts Territory Conquest</h1>
        </header>

        <div id="login-screen" class="screen">
            <div class="wizard-card">
                <h2>Enter Your Wizard Name</h2>
                <input type="text" id="player-name" placeholder="e.g., Gryffindor Wizard">
                <button id="join-game-btn" class="hp-button">Join Game</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen hidden">
            <div class="wizard-card">
                <h2>Waiting Room</h2>
                <div class="player-list-container">
                    <h3>Connected Wizards</h3>
                    <ul id="player-list"></ul>
                </div>
                <p class="waiting-text">Waiting for wizards (2-4 needed)</p>
                <button id="start-game-btn" class="hp-button" disabled>Begin Adventure</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-board">
                <div id="map-container"></div>
                <div id="game-info">
                    <div class="player-stats-container">
                        <h3>Player Stats</h3>
                        <div id="player-stats"></div>
                    </div>
                    <div id="action-log">
                        <h3>Action Log</h3>
                        <div id="log-entries"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="quiz-modal" class="modal hidden">
        <div class="modal-content wizard-card">
            <h2>Magical Duel</h2>
            <div id="timer">30</div>
            <div id="duel-status"></div>
            <div id="question-container">
                <p id="question-text"></p>
                <div id="answers-container"></div>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content wizard-card">
            <h2>The Battle is Over!</h2>
            <div id="winner-text"></div>
            <button id="new-game-btn" class="hp-button">New Adventure</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/game.js"></script>
</body>
</html>
